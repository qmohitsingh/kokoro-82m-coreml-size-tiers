name: KokoroSizeS014
options:
  bundleIdPrefix: com.kokorosize
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
targets:
  KokoroSize:
    type: application
    platform: iOS
    # Tier 50mb (S018). Bundle id and optional signing come from Config-S014.xcconfig,
    # which includes the git-ignored Signing.local.xcconfig when present.
    configFiles:
      Debug: Config-S014.xcconfig
      Release: Config-S014.xcconfig
    sources:
      - path: KokoroSize
      # Resources-S014 links into artifacts/hf/50mb/ (see scripts/download_models.py --tier 50mb).
      - path: Resources-S014
    settings:
      base:
        PRODUCT_NAME: KokoroSize
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) S014"
schemes:
  KokoroSize:
    build:
      targets:
        KokoroSize: all
    run:
      config: Release
